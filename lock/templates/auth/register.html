{% extends 'base.html' %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<section class="section narrow">
  <div class="auth-card">
    <span class="eyebrow">Comece a praticar</span>
    <h1>Seu treino começa aqui.</h1>
    <p>Crie um perfil para acompanhar suas respostas e continuar de onde parou.</p>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="name">Nome</label>
      <input id="name" name="name" maxlength="100" required value="{{ request.form.get('name', '') }}">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="150" required value="{{ request.form.get('email', '') }}">
      <label for="password">Senha <span>mínimo de 8 caracteres</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmation">Confirmar senha</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" required>
      <button class="button button-full" type="submit">Criar conta</button>
    </form>
  </div>
</section>
{% endblock %}
